<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Case File: The Fifth Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script>
/* Load web fonts without blocking first paint (system fonts show instantly, then swap). */
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&display=swap';document.head.appendChild(l);})();

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#181109;
    --panel:#241a10;
    --panel-2:#2f2214;
    --paper:#ecdfba;
    --paper-2:#e0cf9c;
    --stamp:#8a1f1f;
    --stamp-dark:#5e1414;
    --gold:#bb9142;
    --text:#ecdfc4;
    --muted:#a89478;
    --line:#4a3820;
    --good:#5f7a45;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #3a2210 0%, transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, #2a0f0f 0%, transparent 55%),
      var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    line-height:1.5;
  }
  h1,h2,h3,.serif{font-family:'Cinzel',serif;}
  .mono{font-family:'Courier Prime',monospace;}
  #app{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}
  a{color:var(--gold);}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  ::selection{background:var(--gold);color:#1b1b1b;}

  /* ---- Layout chrome ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .badge{
    width:44px;height:44px;border-radius:50%;
    background:var(--stamp);border:2px solid #d8b978;
    display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel',serif;font-weight:800;color:#fff0da;font-size:18px;
    transform:rotate(-6deg);
    box-shadow:0 3px 0 rgba(0,0,0,.35);
  }
  .brand-text .k{font-size:11px;letter-spacing:.12em;color:var(--muted);}
  .brand-text h1{font-size:20px;margin:0;color:var(--text);}
  .pillbtn{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:8px 14px;border-radius:20px;font-size:13px;
  }
  .pillbtn:hover{border-color:var(--gold);color:var(--gold);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;}
  .card + .card{margin-top:16px;}

  /* ---- Landing ---- */
  .hero{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:40px 36px;
    position:relative;
    overflow:hidden;
    margin-bottom:22px;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background-image:repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 5px);
    pointer-events:none;
  }
  .hero .tag{font-family:'Courier Prime',monospace;color:var(--gold);font-size:13px;letter-spacing:.04em;}
  .hero h1{font-size:38px;margin:10px 0 12px;max-width:640px;line-height:1.15;}
  .hero p{max-width:600px;color:var(--muted);font-size:15.5px;}
  .role-row{display:flex;gap:16px;margin-top:26px;flex-wrap:wrap;}
  .role-card{
    flex:1;min-width:230px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:20px;text-align:left;color:var(--text);
    transition:transform .15s ease, border-color .15s ease;
  }
  .role-card:hover{transform:translateY(-2px);border-color:var(--gold);}
  .role-card h3{margin:0 0 6px;font-size:17px;}
  .role-card p{margin:0;color:var(--muted);font-size:13.5px;}
  .role-card .go{margin-top:14px;color:var(--gold);font-size:13px;font-weight:600;}

  .steps-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px;}
  .steps-strip .s{
    font-family:'Courier Prime',monospace;font-size:12px;color:var(--muted);
    border:1px dashed var(--line);padding:6px 10px;border-radius:6px;
  }

  /* ---- Forms ---- */
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  input[type=text],input[type=password],textarea{
    width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:11px 12px;font-family:'Inter',sans-serif;font-size:14.5px;
  }
  textarea{resize:vertical;min-height:90px;font-family:'Courier Prime',monospace;line-height:1.5;}
  input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .field{margin-bottom:16px;}
  .btn{
    background:var(--stamp);color:#fff0da;border:none;padding:12px 22px;border-radius:8px;
    font-weight:600;font-size:14.5px;letter-spacing:.01em;
  }
  .btn:hover{background:var(--stamp-dark);}
  .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn.secondary:hover{border-color:var(--gold);color:var(--gold);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .err{color:#e08a76;font-size:13px;margin-top:8px;}

  /* ---- Progress stepper ---- */
  .stepper{display:flex;gap:4px;margin-bottom:22px;flex-wrap:wrap;}
  .stepper .st{
    flex:1;min-width:70px;text-align:center;padding:8px 4px;border-radius:6px;
    font-size:11px;font-family:'Courier Prime',monospace;color:var(--muted);
    border-bottom:3px solid var(--line);
  }
  .stepper .st.done{color:var(--good);border-bottom-color:var(--good);}
  .stepper .st.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(201,162,75,.08);}

  .case-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
  .case-header .stamp-tag{
    background:var(--stamp);color:#fff0da;font-family:'Courier Prime',monospace;
    font-size:11px;padding:4px 10px;border-radius:4px;transform:rotate(-2deg);display:inline-block;
  }
  .timer{
    font-family:'Courier Prime',monospace;font-size:22px;background:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:8px 16px;color:var(--gold);
    min-width:100px;text-align:center;
  }
  .timer.low{color:#e08a76;border-color:#e08a76;}
  .pillbtn.low{color:#e08a76;border-color:#e08a76;}

  .briefing-paper{
    background:var(--paper);color:#2a2416;border-radius:4px;padding:58px 28px 26px;margin-top:16px;
    font-family:'Courier Prime',monospace;font-size:14.5px;line-height:1.7;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    position:relative;
  }
  .briefing-paper::after{
    content:"CONFIDENTIAL";position:absolute;top:16px;right:20px;color:var(--stamp);
    border:2px solid var(--stamp);padding:2px 10px;transform:rotate(6deg);font-weight:700;
    font-size:12px;opacity:.55;
  }

  /* ---- Evidence grid ---- */
  .evidence-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:18px;}
  .ev-card{
    background:var(--paper);color:#2a2416;border-radius:3px;padding:16px;
    font-size:13.5px;box-shadow:0 5px 14px rgba(0,0,0,.3);
    border:2px solid transparent;transition:transform .12s ease, border-color .12s ease;
    transform:rotate(var(--r,0deg));
  }
  .ev-card:hover{transform:rotate(0deg) translateY(-2px);}
  .ev-card.open{border-color:var(--gold);transform:rotate(0deg) translateY(-2px);}
  .ev-card.reviewed .tag{background:#3a3020;}
  .ev-card .ev-head{cursor:pointer;}
  .ev-card .tag{
    display:inline-block;font-family:'Courier Prime',monospace;font-size:10.5px;
    background:#2a2416;color:var(--paper);padding:2px 7px;border-radius:3px;margin-bottom:8px;
  }
  .ev-card .title{font-family:'Bitter',serif;font-weight:700;font-size:14.5px;margin-bottom:6px;}
  .ev-card .body{font-family:'Courier Prime',monospace;font-size:12.5px;line-height:1.55;display:none;}
  .ev-card.open .body{display:block;}
  .ev-card .foot{margin-top:8px;font-size:11px;color:#6b6247;font-family:'Inter',sans-serif;}
  .ev-classify{
    display:flex;gap:8px;margin-top:12px;padding-top:12px;
    border-top:1px dashed rgba(42,36,22,.3);flex-wrap:wrap;
  }
  .classify-btn{
    flex:1;min-width:120px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
    padding:8px 10px;border-radius:6px;border:1.5px solid rgba(42,36,22,.35);
    background:rgba(255,255,255,.35);color:#2a2416;cursor:pointer;transition:all .12s ease;
  }
  .classify-btn:hover{border-color:#2a2416;}
  .classify-btn.relevant.active{background:var(--good);border-color:var(--good);color:#fff;}
  .classify-btn.herring.active{background:var(--stamp);border-color:var(--stamp);color:#fff0da;}
  .ev-card.twist{
    background:linear-gradient(135deg,#2a1b1b,#3a2020);color:var(--text);border-color:var(--stamp);
    animation:popin .35s ease;
  }
  .ev-card.twist .tag{background:var(--stamp);color:#fff0da;}
  .ev-card.twist .body{color:#e9dccb;}
  /* ---- case file (briefing page + in-room drawer) ---- */
  .casefile{background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:18px 20px;margin:16px 0;}
  .cf-h{font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.06em;color:var(--gold);text-transform:uppercase;margin:16px 0 8px;}
  .cf-brief{font-size:14px;line-height:1.65;color:var(--text);}
  .cf-mission{background:rgba(201,162,75,.10);border:1px solid rgba(201,162,75,.35);border-radius:8px;padding:12px 14px;font-size:14.5px;line-height:1.55;margin-top:14px;}
  .cf-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
  .cf-num{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .cf-num .k{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px;}
  .cf-num .v{font-size:13.5px;line-height:1.45;}
  .cf-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .cf-step{font-family:'Courier Prime',monospace;font-size:12.5px;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 9px;}
  .cf-arrow{color:var(--gold);font-weight:700;}
  .cf-terms{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px;margin:0;font-size:13.5px;}
  .cf-terms dt{font-weight:600;color:var(--text);}
  .cf-terms dd{margin:0;color:var(--muted);line-height:1.45;}
  .cf-judge{font-size:13.5px;color:var(--muted);line-height:1.6;margin:0;}
  .cf-toggle{border-color:var(--gold) !important;color:var(--gold) !important;}
  @media (max-width:560px){.cf-terms{grid-template-columns:1fr;gap:2px;}.cf-terms dd{margin-bottom:8px;}}
  .twist-note{background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--stamp);border-radius:8px;padding:14px 16px;margin:0 0 18px;font-size:14px;color:#e9dccb;}
  @keyframes popin{from{opacity:0;transform:scale(.9) rotate(0deg);}to{opacity:1;transform:scale(1) rotate(0deg);}}

  .reviewed-badge{position:absolute;margin-top:-4px;}

  /* ---- 5 whys ---- */
  .why-chain{margin-top:16px;}
  .why-item{display:flex;gap:14px;margin-bottom:14px;align-items:flex-start;}
  .why-num{
    font-family:'Bitter',serif;font-weight:800;font-size:20px;color:var(--gold);
    width:40px;text-align:center;flex-shrink:0;padding-top:8px;
  }
  .why-item .field{flex:1;margin-bottom:0;}

  /* ---- concept deck ---- */
  .deck-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:10px;}
  .deck-fan{display:flex;gap:-10px;position:relative;height:150px;width:100%;justify-content:center;}
  .card-back{
    width:96px;height:134px;background:linear-gradient(135deg,#2f2214,#241a10);
    border:2px solid var(--gold);border-radius:8px;position:absolute;
    display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Cinzel',serif;font-weight:700;
    box-shadow:0 6px 16px rgba(0,0,0,.4);
  }
  .concept-result{
    background:var(--paper);color:#2a2416;padding:22px 26px;border-radius:8px;max-width:420px;text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .concept-result h2{margin:0 0 6px;font-size:26px;}
  .concept-result .sub{font-family:'Courier Prime',monospace;font-size:12.5px;color:#6b6247;margin-bottom:12px;}
  .concept-result p{font-size:14px;line-height:1.6;}

  /* ---- summary ---- */
  .summary-block{margin-bottom:18px;}
  .summary-block h3{font-size:14px;color:var(--gold);margin:0 0 8px;font-family:'Courier Prime',monospace;letter-spacing:.03em;}
  .summary-block .content{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:14px;white-space:pre-wrap;}
  .summary-block .content.empty{color:var(--muted);font-style:italic;}

  /* ---- facilitator ---- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  tr:hover td{background:rgba(255,255,255,.02);}
  .badge-step{
    font-family:'Courier Prime',monospace;font-size:11px;background:var(--panel-2);
    border:1px solid var(--line);padding:3px 8px;border-radius:12px;color:var(--muted);
  }
  .score-pill{font-family:'Courier Prime',monospace;font-weight:700;color:var(--gold);}
  .rubric-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;}
  .rubric-item label{display:flex;justify-content:space-between;}
  .rubric-item input[type=range]{width:100%;}
  .herring-tag{font-size:10.5px;padding:2px 6px;border-radius:4px;margin-left:6px;font-family:'Courier Prime',monospace;}
  .herring-tag.yes{background:#4a2320;color:#e08a76;}
  .herring-tag.no{background:#20342a;color:var(--good);}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--gold);color:var(--text);
    padding:10px 20px;border-radius:24px;font-size:13.5px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.4);
  }
  .muted{color:var(--muted);}
  .small{font-size:12.5px;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  hr.dash{border:none;border-top:1px dashed var(--line);margin:20px 0;}
  @media (max-width:640px){
    .hero h1{font-size:28px;}
    .rubric-grid{grid-template-columns:1fr;}
  }
</style>
</head>

<div id="app"></div>
<script>
/* =========================================================
   5 WHYS DETECTIVE — single-file app
   Storage: artifact `db` capability (shared documents, so the facilitator
   dashboard can see every participant's work)
   ========================================================= */

const FACILITATOR_PASSWORD = "Case5Whys!26"; // change this to reset the facilitator password

/* =========================================================
   LIVE SYNC VIA GITHUB (one-time setup)
   Data lives as small JSON files in a GitHub repo; every browser reads/writes
   them through the GitHub API, so the facilitator board updates within ~3 s.

   1. Create a PRIVATE repo for the data, e.g. "fifth-gate-data" (add a README so the branch exists).
   2. github.com -> Settings -> Developer settings -> Fine-grained tokens -> Generate:
        Repository access: ONLY that data repo
        Permissions: Contents = Read and write      (nothing else)
   3. Fill GH_OWNER / GH_REPO below. Do NOT paste the token in this file if the file
      goes in a public repo: open the page once as   https://YOU.github.io/REPO/#k=YOUR_TOKEN
      (or use the facilitator's "Copy participant link" button) - the key is read from
      the URL, stored in the browser and removed from the address bar.
   4. Host this file with GitHub Pages (public repo -> Settings -> Pages -> main / root).
   Until GH_OWNER/GH_REPO/key are set the app runs in LOCAL MODE (tabs of one browser only).
   ========================================================= */
const GH_OWNER  = "akshatharathinavelu15-cmyk";            // your GitHub username or org
const GH_REPO   = "fifth-gate-data";            // the (private) data repo
const GH_BRANCH = "main";
const GH_TOKEN  = "";            // optional; leave empty and use the #k= link instead
const EVENT_ID  = "fifth-gate-1"; // change to start a fresh empty board

// ---------- CASE LIBRARY (15 cases) ----------
const CONCEPTS = [
  {id:"vsm", name:"Value Stream Mapping (VSM)", blurb:"Map the end-to-end flow of material and information to expose delays, handoffs, and non-value-add steps between the root cause and the customer."},
  {id:"pokayoke", name:"Poka-Yoke (Error Proofing)", blurb:"Design a mechanism, jig, or check that makes the specific error physically impossible or immediately obvious the moment it would occur."},
  {id:"kaizen", name:"Kaizen (Continuous Improvement Event)", blurb:"Run a focused, small-team improvement sprint that tests a fast, low-cost countermeasure at the point of the defect and iterates on it."},
  {id:"kanban", name:"Kanban (Pull & Visual Signal)", blurb:"Introduce a visual pull signal that controls handoffs, work-in-progress, or replenishment so problems surface immediately instead of piling up downstream."},
  {id:"smed", name:"SMED (Single-Minute Exchange of Die)", blurb:"Separate and streamline changeover/setup steps so transitions between products, shifts, or configurations stop being a source of variation and error."},
  {id:"5s", name:"5S (Workplace Organization)", blurb:"Sort, set in order, shine, standardize, and sustain the physical or digital workplace so the conditions that allowed the defect can't quietly persist."},
  {id:"dmaic", name:"DMAIC (Six Sigma Problem-Solving Cycle)", blurb:"Define, Measure, Analyze, Improve and Control — use data to isolate the true driver of variation or defects, prove the fix experimentally, and lock it in with a control plan."},
  {id:"standardwork", name:"Standard Work", blurb:"Document the current best-known method, sequence and timing for the task so the process stops depending on who is doing it and improvement has a baseline to build on."}
];

function ev(id,tag,title,text,herring){return {id,tag,title,text,herring:!!herring};}

const CASES = [
/* 1 */ {
  title:"The Trim Panel That Waited Two Days",
  industry:"Automotive Aftermarket Logistics (Spare Parts)",
  briefing:"A mid-size automotive manufacturer's aftermarket logistics operation is fielding recurring complaints from dealers on three continents about delayed delivery of a door-trim replacement part. Customers waiting on repairs are leaving the shop empty-handed, and a few dealers have started sourcing panels from a competing aftermarket supplier. On paper the part's journey is six clean steps: warehouse pick, cross-dock, freight forwarder, customs, regional hub, dealer delivery. Tracking it in practice tells a different story. You have ten minutes in the evidence room; then the aftermarket director needs an answer.",
  evidence:[
    ev("E1","Ops/SCM — Freight Log","Regional hub dwell record","Tracking data shows the part sits idle for roughly two full days at the regional hub, waiting for outbound trailers to reach a fill threshold before a truck is released.",false),
    ev("E2","Ops/SCM — Process Note","Cross-dock handling note","The part is unloaded, re-labelled and re-palletised at both the cross-dock and the regional hub — the same box is physically handled twice with no value added at either stop.",false),
    ev("E3","Quality Log","Damage and returns record","Physical damage rates on this part are low and stable across the period, ruling out packaging or handling damage as the cause of delay.",true),
    ev("E4","Customs / Documentation","Export paperwork queue log","Export documentation is compiled only after the part is picked, so shipments queue for customs clearance instead of clearing in parallel with picking.",false),
    ev("E5","Marketing — Dealer Complaint","Dealer escalation transcript","Dealers report the part is 'promised in days and arrives in weeks,' and say the quoted lead time has never matched reality on this part number for at least a year.",false),
    ev("E6","IT/WMS Log","Order tracking system audit","Each system segment tracks only its own leg. No single report exists showing total elapsed time from dealer order to dealer receipt across all six steps.",false),
    ev("E7","HR/People — Warehouse Staffing","Pick shift roster","Warehouse headcount on the picking line has been stable for eighteen months and pick productivity is above target.",true),
    ev("E8","Engineering","Part design change note","A minor cosmetic revision to the trim panel's clip design was released last year and has no bearing on how the part is shipped.",true)
  ],
  twist:{tag:"9TH EVIDENCE — JUST IN",text:"Procurement has mapped the full door-to-door flow end to end for the first time. Of the total elapsed delivery time, the large majority is waiting, paperwork queuing and double-handling between hubs — actual transport and picking work account for only a small fraction. Nobody had ever seen the whole journey on one page before."},
  facilitatorNotes:{
    suggestedRootCause:"No one owns or measures the end-to-end replacement-part delivery stream; each function optimises its own leg, so waiting, duplicate handling and sequential paperwork accumulate invisibly between steps. (Documented fix: Value Stream Mapping plus an A3 report to expose and eliminate non-value-adding activity across the flow.)",
    herringIds:["E3","E7","E8"]
  },
  source:"Fortuny-Santos, J. et al., Applied Sciences (MDPI), 2019 — https://www.mdpi.com/2076-3417/9/18/3932"
},
/* 2 */ {
  title:"The Ninety-Minute Changeover",
  industry:"Food Manufacturing (Packaged Snacks)",
  briefing:"At a packaged-foods plant, switching the production line from a savory cracker to a sweet variant is officially budgeted at 45 minutes. In practice, changeovers regularly stretch past ninety, and twice in one quarter a late-afternoon changeover bled into paid overtime. Corporate has asked for higher throughput without adding a second production line. Nobody can say where the lost time actually goes. Find out before the capacity plan is signed off.",
  evidence:[
    ev("E1","Ops — Changeover Timing","Stopwatch study of one changeover","A timed observation shows operators spend a large block of the changeover walking to the tool crib and searching for the correct die, sealing plates and spanners — all while the line is stopped.",false),
    ev("E2","Engineering","Setup parameter sheet","There is no documented setting sheet for the sweet variant. Temperature, pressure and speed are dialled in by trial and error, run a test batch, adjust, repeat, until the product looks right.",false),
    ev("E3","Maintenance Log","Line reliability record","Unplanned breakdown hours on this line are low and trending down; the equipment itself is running reliably.",true),

  briefing:"At a regional hospital, moving a wheelchair-bound patient from the ward to the X-ray suite takes only a few minutes of actual travel. Yet the whole activity consistently consumes around twenty minutes per patient. Staff overtime is climbing, patients complain about being parked in corridors, and radiology's daily patient count is not budging even though nobody is working less hard. Something between 'ready for X-ray' and 'in the imaging room' is eating the appointment.",

    ev("E2","Ops — Equipment Note","Wheelchair availability audit","Wheelchairs are not assigned to wards or returned to a fixed point after use. Staff search multiple floors to find an available chair before each transport.",false),

  ],
  twist:{tag:"9TH EVIDENCE — JUST IN",text:"The activity has now been split into value-added and non-value-added time. Of the roughly twenty minutes, around eighteen are non-value-added: searching, waiting, chart-checking, queueing. The imaging-related value-adding portion is only a couple of minutes."},
  facilitatorNotes:{
    suggestedRootCause:"The transport process has never been mapped as a flow, so preparation, equipment searching and dispatch waiting are treated as unavoidable background rather than removable non-value-added time. (Documented fix: a two-phase Lean Healthcare approach — survey and map to find root causes of waste, then apply targeted Lean tools integrated with ergonomics. Result: total activity time fell 72.2%, from 20 minutes to 7, with non-value-added time cut from 18 minutes to 5.)",

  briefing:"A public university hospital's emergency department was overcrowded: packed corridors, exhausted nurses, patients waiting hours past triage. Government funding supported a formal 'Lean in Emergencies' programme. Consultants mapped processes, ran workshops and proposed new workflows. Eighteen months later the corridors are just as crowded, departmental staff turnover is higher than before, and several new procedures have quietly been abandoned. Your job is to work out why the improvement failed — not why the department was busy.",

    ev("E4","Facilities Log","Building maintenance record","Routine building maintenance was performed on schedule throughout the programme with no disruption to clinical areas.",true),

    ev("E7","IT/Clinical System Log","Triage software version note","The triage software was upgraded during the same period, but the upgrade was routine and functionally equivalent to the prior version.",true),

  facilitatorNotes:{
    suggestedRootCause:"Lean was implemented as a funded, externally-led project rather than as a management system owned by the people doing the work, so no capability or ownership remained to sustain the changes. This case is documented as a lean failure precisely because it exposes organisational and behavioural barriers rather than tool-selection error.",

  briefing:"Five U.S. hospital systems, none coordinating with each other, are independently wrestling with the same frustration: rising costs, uneven quality of care, and no shared method for fixing either. Each has tried isolated improvement efforts — a new scheduling tool here, a staffing tweak there — but changes made in one department rarely survive once staff rotate or leadership moves on. A federal research agency has opened a file. Work out what these organisations actually have in common.",

  twist:{tag:"9TH EVIDENCE — JUST IN",text:"Three site processes have now been analysed step by step for value-adding versus non-value-adding activity. Waste is not a materials problem alone — over-ordering, unplanned staging and unoptimised cutting are each generating both physical waste and waiting time, and together account for roughly half the waste measured on site."},

/* GitHub-backed (live) when GH_OWNER/GH_REPO/key are set; otherwise localStorage +

const PLAYER_PREFIX = 'player:';
function safeId(id){ return String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_'); }
function readKey(){
  let t = GH_TOKEN || '';
  try{
    const m = /[#&]k=([^&]+)/.exec(location.hash);
    if(m){
      t = decodeURIComponent(m[1]);
      try{ localStorage.setItem('fg_k', t); }catch(e){}
      try{ history.replaceState(null,'',location.href.split('#')[0]); }catch(e){}
    } else if(!t){ t = localStorage.getItem('fg_k') || ''; }
  }catch(e){}
  return t;
}

/* ---- GitHub API helpers ---- */
const _etag = new Map();   // url -> {etag, body}  (304 replies are free against the rate limit)
function ghUrl(path, withRef){ return `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}` + (withRef ? `?ref=${encodeURIComponent(GH_BRANCH)}` : ''); }
function ghHeaders(extra){ return Object.assign({Authorization:'Bearer '+GH_KEY, Accept:'application/vnd.github+json'}, extra||{}); }
async function ghGet(path, force){
  const url = ghUrl(path, true), c = _etag.get(url);
  const h = ghHeaders(); if(c && !force) h['If-None-Match'] = c.etag;
  const r = await fetch(url, {headers:h, cache:'no-store'});
  if(r.status === 304 && c) return c.body;
  if(r.status === 404){ _etag.delete(url); return null; }
  if(!r.ok) throw new Error('GitHub ' + r.status);
  const body = await r.json(), et = r.headers.get('ETag');
  if(et) _etag.set(url, {etag:et, body});
  return body;
}
function ghDecode(file){ return JSON.parse(decodeURIComponent(escape(atob(file.content.replace(/\n/g,''))))); }
function ghEncode(obj){ return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
let _wq = Promise.resolve();                       // one write at a time per browser
function ghQueue(fn){ const p = _wq.then(fn, fn); _wq = p.catch(()=>{}); return p; }
async function ghPut(path, mutate){                // read-modify-write with retry on conflicts
  for(let i=0;i<6;i++){
    const cur = await ghGet(path, true);
    const next = mutate(cur && cur.content ? ghDecode(cur) : null);
    const body = {message:'sync', content:ghEncode(next), branch:GH_BRANCH}; if(cur) body.sha = cur.sha;
    const r = await fetch(ghUrl(path,false), {method:'PUT', headers:ghHeaders({'Content-Type':'application/json'}), body:JSON.stringify(body)});
    if(r.ok){ _etag.delete(ghUrl(path,true)); _etag.delete(ghUrl(path.replace(/\/[^/]*$/,''),true)); return true; }
    if(r.status === 409 || r.status === 422){ await sleep(150 + Math.random()*400*(i+1)); continue; }
    throw new Error('GitHub write ' + r.status);
  }
  return false;
}
function pathFor(key){
  return key.indexOf(PLAYER_PREFIX)===0 ? PLAYERS_DIR+'/'+safeId(key.slice(PLAYER_PREFIX.length))+'.json' : KV_DIR+'/'+safeId(key)+'.json';
}
async function ensureSeed(){                       // directories must exist so polling can use cheap 304s
  for(const d of [PLAYERS_DIR, KV_DIR]){
    try{ if((await ghGet(d)) === null) await ghQueue(()=>ghPut(d+'/_seed.json', c=>c||{seed:true})); }catch(e){}
  }
}

function lsKeys(prefix){
  const out = [];
  try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k.indexOf(LS_PREFIX+prefix)===0) out.push(k.slice(LS_PREFIX.length)); } }catch(e){}

}

  if(!LIVE_MODE) return lsWrite(key, value);
  try{
    const ok = await ghQueue(()=>ghPut(pathFor(key), ()=>({k:key, v:value, at:Date.now()})));
    if(ok && _liveCache && _liveCache.has(key)) _liveCache.set(key, value);
    return ok;
  }catch(e){ console.error('set failed', key, e); return false; }
}
// Merge-write: only touches fields in `patch`.
async function storageUpdate(key, patch){
  if(!LIVE_MODE){ const cur = lsRead(key) || {}; return lsWrite(key, Object.assign({}, cur, patch)); }
  try{
    const ok = await ghQueue(()=>ghPut(pathFor(key), cur=>({k:key, v:Object.assign({}, cur && cur.v, patch), at:Date.now()})));
    if(ok && _liveCache && _liveCache.has(key)) _liveCache.set(key, Object.assign({}, _liveCache.get(key), patch));
    return ok;
  }catch(e){ console.error('update failed', key, e); return false; }
}
async function storageListKeys(prefix){
  if(_liveCache && prefix === PLAYER_PREFIX) return Array.from(_liveCache.keys()).filter(k=>k.indexOf(prefix)===0);
  if(!LIVE_MODE) return lsKeys(prefix);
  try{
    const isP = prefix === PLAYER_PREFIX;
    const list = await ghGet(isP ? PLAYERS_DIR : KV_DIR);
    if(!Array.isArray(list)) return [];
    return list.filter(x=>x.name.endsWith('.json') && x.name[0] !== '_')
               .map(x=>(isP ? PLAYER_PREFIX : '') + x.name.slice(0,-5))
               .filter(k=>k.indexOf(prefix)===0);
  }catch(e){ console.error('list failed', prefix, e); return []; }
}

/* Facilitator live feed: onChange() fires whenever any participant saves. */
let _unsubLive = null;
function startLiveFeed(onChange){
  stopLiveFeed();
  _liveCache = new Map();
  if(LIVE_MODE){
    let stop = false, timer = null, first = true; const shas = new Map();
    const tick = async ()=>{
      if(stop) return;
      try{
        const list = await ghGet(PLAYERS_DIR);
        let changed = first; first = false;
        const seen = new Set();
        if(Array.isArray(list)){
          await Promise.all(list.filter(x=>x.name.endsWith('.json') && x.name[0] !== '_').map(async x=>{
            seen.add(x.name);
            if(shas.get(x.name) !== x.sha){
              const f = await ghGet(PLAYERS_DIR+'/'+x.name, true);
              if(f){ _liveCache.set(PLAYER_PREFIX + x.name.slice(0,-5), ghDecode(f).v); shas.set(x.name, x.sha); changed = true; }
            }
          }));
        }
        if(changed && !stop) onChange();
      }catch(e){ console.error('live feed error', e); }
      if(!stop) timer = setTimeout(tick, 3000);
    };
    tick();
    _unsubLive = ()=>{ stop = true; clearTimeout(timer); };
  } else {
    const rebuild = ()=>{ _liveCache = new Map(); lsKeys(PLAYER_PREFIX).forEach(k=>_liveCache.set(k, lsRead(k))); onChange(); };
    rebuild();
    if(_bc) _bc.onmessage = rebuild;
    window.addEventListener('storage', rebuild);
    const t = setInterval(rebuild, 4000);
    _unsubLive = ()=>{ clearInterval(t); window.removeEventListener('storage', rebuild); if(_bc) _bc.onmessage = null; };
  }
}
function stopLiveFeed(){
  if(_unsubLive){ try{ _unsubLive(); }catch(e){} _unsubLive = null; }
  _liveCache = null;
}
function copyParticipantLink(){
  const base = location.href.split('#')[0];
  const link = GH_KEY ? base + '#k=' + encodeURIComponent(GH_KEY) : base;
  const done = ()=>showToast('Participant link copied — share it with your group.');
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(link).then(done, ()=>fallbackCopy(link, done)); }
  else fallbackCopy(link, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ showToast('Copy failed — copy the page URL manually and add #k=YOUR_TOKEN'); }
  ta.remove();
}

function slug(name){
  return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'detective';
}
function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h;
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function fmtClock(ts){
  if(!ts) return '—';
  return new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function relTime(ts){
  if(!ts) return '—';
  const diffSec = Math.max(0, Math.round((Date.now()-ts)/1000));
  if(diffSec < 45) return 'just now';
  const m = Math.round(diffSec/60);
  if(m < 60) return m+' min ago';
  const h = Math.round(m/60);
  if(h < 24) return h+' hr ago';
  return new Date(ts).toLocaleDateString();
}

// Saves are debounced and coalesced: any number of clicks inside ~300 ms become ONE
// db write, only one write is ever in flight, and the UI never waits on the network.
let _savePl = null, _saveTimer = null, _saveInFlight = false, _saveDirty = false, _lastSaveToast = 0;
let _skipScorePreserveNext = false;
function savePlayer(immediate){
  if(!state.player) return Promise.resolve();
  _savePl = state.player;
  _savePl.updatedAt = Date.now();
  _saveDirty = true;
  if(immediate){ clearTimeout(_saveTimer); _saveTimer = null; return flushSave(); }
  if(!_saveTimer && !_saveInFlight) _saveTimer = setTimeout(flushSave, 300);
  return Promise.resolve();
}
async function flushSave(){
  _saveTimer = null;
  if(_saveInFlight || !_saveDirty || !_savePl) return;
  _saveInFlight = true; _saveDirty = false;
  const pl = _savePl;
  const skipPreserve = _skipScorePreserveNext; _skipScorePreserveNext = false;
  try{
    if(!skipPreserve){
      try{
        const remote = await storageGet('player:'+pl.username, true);
        if(remote && remote.scores !== undefined){ pl.scores = remote.scores; pl.totalScore = remote.totalScore; }
      }catch(e){ /* best-effort — fall through to saving normally either way */ }
    }
    const ok = await storageSet('player:'+pl.username, pl, true);
    if(!ok && Date.now() - _lastSaveToast > 10000){
      _lastSaveToast = Date.now();
      showToast('⚠ Could not save — check your connection. Your work is still on screen.');
    }
  } finally {
    _saveInFlight = false;
    if(_saveDirty){ _saveTimer = setTimeout(flushSave, 300); }
  }
}

// ---------- TIMER ----------
function stopTimer(){

function startTimer(totalSeconds, label, onTick, onExpire){
  stopTimer();
  state.timerTotal = totalSeconds;
  state.timerSeconds = totalSeconds;
  state.timerLabel = label;
  state.timerEndAt = Date.now() + totalSeconds*1000;
  state.timerHandle = setInterval(()=>{
    state.timerSeconds = Math.max(0, Math.round((state.timerEndAt - Date.now())/1000));
    if(onTick) onTick(state.timerSeconds);
    if(state.timerSeconds <= 0){
      stopTimer();
      if(onExpire) onExpire();
    }
  },1000);
}
function timerRunning(label){ return !!state.timerHandle && state.timerLabel === label; }

let _loggingIn = false;
async function doParticipantLogin(){
  if(_loggingIn) return;
  const nameEl = document.getElementById('loginName');
  const emailEl = document.getElementById('loginEmail');
  const email = (emailEl.value||'').trim().toLowerCase();
  const errEl = document.getElementById('loginErr');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ errEl.textContent = 'Please enter a valid email address.'; errEl.style.display='block'; return; }
  const name = (nameEl.value||'').trim() || email.split('@')[0];
  _loggingIn = true;
  const btn = document.getElementById('loginBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Opening your case file…'; }
  const username = slug(email);
  let existing;
  try{ existing = await storageGet('player:'+username, true); } finally { _loggingIn = false; }
  if(existing){
    state.player = existing;
  } else {
    const caseIndex = hashStr(username) % CASES.length;

  state.username = username;
  routeToPlayerStep();
}

let _restartArmed = 0;
function restartCase(btn){
  // two-step confirm without confirm() (dialogs can be blocked inside hosted pages)
  if(Date.now() - _restartArmed > 4000){
    _restartArmed = Date.now();
    btn.textContent = 'Click again to wipe & restart';
    setTimeout(()=>{ if(btn.isConnected) btn.textContent = '↺ Restart case'; }, 4000);
    return;
  }
  const old = state.player;
  const fresh = blankPlayer(old.username, old.caseIndex);
  fresh.displayName = old.displayName;
  state.player = fresh; state.evExpanded = {}; state.evidenceTimerActive = false;
  stopTimer(); stopPoll(); stopOverallTimer(); stopCaseFileClock();
  state.caseOpen = false; state.caseFileOpenedAt = null;
  _skipScorePreserveNext = true;
  savePlayer();
  goto('briefing');
}
function logout(){
  stopLiveFeed();
  if(state.player){ captureDrafts(); flushCaseFileTime(); savePlayer(true); }
  stopTimer(); stopPoll(); stopOverallTimer(); stopCaseFileClock();
  state = {role:null, username:null, player:null, view:'landing', facilitatorDetailUser:null, evExpanded:{}, timerHandle:null, pollHandle:null, evidenceTimerActive:false, drawingConcept:false, overallTimerHandle:null};
  render();
}

function goto(view){
  stopTimer();
  if(view !== 'facilitator-dashboard') stopLiveFeed();
  if(view !== 'evidence' && view !== 'whys') stopPoll();
  // Leaving the evidence room for real (not just re-rendering inside it) —
  // clear the flag so the countdown starts fresh next time they enter it.
  if(state.view === 'evidence' && view !== 'evidence'){ state.evidenceTimerActive = false; }
  if(state.view !== view){ flushCaseFileTime(); stopCaseFileClock(); state.caseOpen = false; }
  state.view = view;
  render();
  window.scrollTo(0,0);
}

  // classifying evidence) because those call render() directly — without
  // this guard, startTimer() would wipe the countdown back to full every
  // single click, which is why the 10-min clock and the 8-min auto-reveal
  // never actually ran in practice. Real navigation away from 'evidence'
  // (see goto()) clears the flag so re-entering the room later starts fresh.
  if(!state.evidenceTimerActive){
    state.evidenceTimerActive = true;
    // The 10-minute room clock starts the first time the player enters and is
    // remembered, so leaving for Five Whys and coming back doesn't restart it.
    if(!state.player.evidenceStartedAt){ state.player.evidenceStartedAt = Date.now(); savePlayer(); }
    const remaining = Math.max(0, EVIDENCE_ROOM_SECONDS - Math.floor((Date.now() - state.player.evidenceStartedAt)/1000));
    if(!state.player.twistRevealed && evidenceElapsed() >= TWIST_RELEASE_AT_SECONDS){
      state.player.twistRevealed = true; savePlayer();   // 8 minutes already passed while away
    }
    startTimer(remaining, 'Evidence Investigation', (sec)=>{
      const t = document.getElementById('evTimer');
      if(t){ t.textContent = fmtTime(sec); if(sec<=90) t.classList.add('low'); }
      if(!state.player.twistRevealed && evidenceElapsed() >= TWIST_RELEASE_AT_SECONDS){
        revealTwist();
      }
    }, ()=>{});
    startTwistWatch();
  }

  if(!state.player.evidenceClassification) state.player.evidenceClassification = {};
  if(!state.evExpanded) state.evExpanded = {};

  const rotations = [-2,1,-1,2,-1.5,1.5,-2.5,1];
  const classification = state.player.evidenceClassification;
  const classifiedCount = c.evidence.filter(e=>classification[e.id]).length;
  const cardsHtml = c.evidence.map((e,i)=>{
    const opened = !!state.evExpanded[e.id];
    const reviewed = state.player.evidenceReviewed.includes(e.id);
    const guess = classification[e.id]; // 'relevant' | 'herring' | undefined
    return `<div class="ev-card ${opened?'open':''} ${reviewed?'reviewed':''}" data-ev="${e.id}" style="--r:${rotations[i%rotations.length]}deg">
      <div class="ev-head" onclick="toggleEvidence('${e.id}')">
        <span class="tag">${escapeHtml(e.tag)}</span>
        <div class="title">${escapeHtml(e.title)}</div>
        <div class="foot">${opened ? 'Tap to collapse' : (reviewed ? '✓ Reviewed — tap to reopen' : 'Tap to open folder')}</div>
      </div>
      <div class="body">
        <div class="body-text">${escapeHtml(e.text)}</div>
        <div class="ev-classify" role="group" aria-label="Classify this evidence">
          <button type="button" class="classify-btn relevant ${guess==='relevant'?'active':''}" onclick="event.stopPropagation(); classifyEvidence('${e.id}','relevant')">✓ Relevant Clue</button>
          <button type="button" class="classify-btn herring ${guess==='herring'?'active':''}" onclick="event.stopPropagation(); classifyEvidence('${e.id}','herring')">🚩 Red Herring</button>
        </div>
      </div>
    </div>`;
  }).join('');

  const twistHtml = state.player.twistRevealed ? `
    <div class="ev-card twist open" style="--r:0deg">
      <div class="ev-head" style="cursor:default;">
        <span class="tag">${escapeHtml(c.twist.tag)}</span>
        <div class="title">Evidence #9</div>
        <div class="foot" style="color:#e0b98f;">New — factor this into your Five Whys</div>
      </div>
      <div class="body">
        <div class="body-text">${escapeHtml(c.twist.text)}</div>
      </div>
    </div>` : '';

  return `
  ${stepperHtml(1)}
  <div class="card">
    <div class="case-header">
      <div>
        <span class="stamp-tag">CASE #${state.player.caseIndex+1}</span>
        <h2 style="margin:10px 0 0;">Evidence Room</h2>
      </div>
      <div class="row">${caseFileToggleBtn()}<div class="timer" id="evTimer">${fmtTime(state.timerSeconds)}</div></div>
    </div>
    ${caseFilePanel(c)}
    <p class="muted small"><span id="evCount">${state.player.evidenceReviewed.length}/8 folders opened · ${classifiedCount}/8 classified.</span> Open a folder, read it, then mark it <strong>Relevant Clue</strong> (helps explain <em>why</em> the problem happens) or <strong>Red Herring</strong> (true, but doesn't explain it). About 2–3 of the 8 are noise. Need the story again? Open the <strong>📂 Case file</strong> — your clock keeps running. A 9th piece of evidence will surface automatically eight minutes in.${state.timerSeconds<=0 ? ' <strong style="color:#e08a76;">⏱ This room\'s clock has run out — use “↺ Restart case” (top right) for a fresh 10:00 and a clean start.</strong>' : ''}</p>
    <div class="evidence-grid">${cardsHtml}${twistHtml}</div>
    <div class="row" style="margin-top:20px;">
      <button class="btn" onclick="advanceTo('whys')">Proceed to Five Whys →</button>
      <button class="btn secondary" onclick="advanceTo('briefing')" title="Leaves the Evidence Room; your room clock keeps running">← Full briefing page</button>
    </div>
  </div>`;
}

// Update the cards in place: no page rebuild, no flicker, no scroll jump, instant response.
function paintEvidence(){
  const p = state.player, c = CASES[p.caseIndex];
  const cls = p.evidenceClassification || {};
  let classified = 0;
  document.querySelectorAll('.ev-card[data-ev]').forEach(card=>{
    const id = card.dataset.ev;
    const opened = !!state.evExpanded[id];
    const reviewed = p.evidenceReviewed.includes(id);
    if(cls[id]) classified++;
    card.classList.toggle('open', opened);
    card.classList.toggle('reviewed', reviewed);
    card.querySelector('.foot').textContent = opened ? 'Tap to collapse' : (reviewed ? '✓ Reviewed — tap to reopen' : 'Tap to open folder');
    card.querySelector('.classify-btn.relevant').classList.toggle('active', cls[id] === 'relevant');
    card.querySelector('.classify-btn.herring').classList.toggle('active', cls[id] === 'herring');
  });
  const el = document.getElementById('evCount');
  if(el) el.textContent = p.evidenceReviewed.length + '/8 folders opened · ' + classified + '/8 classified.';
}

function toggleEvidence(id){
  state.evExpanded[id] = !state.evExpanded[id];
  if(state.evExpanded[id] && !state.player.evidenceReviewed.includes(id)){
    state.player.evidenceReviewed.push(id);
    savePlayer();
  }
  paintEvidence();
}

function classifyEvidence(id, guess){
  if(!state.player.evidenceClassification) state.player.evidenceClassification = {};
  const current = state.player.evidenceClassification[id];
  // tapping the same classification again clears it; otherwise set it
  state.player.evidenceClassification[id] = (current === guess) ? undefined : guess;
  if(state.player.evidenceClassification[id] === undefined) delete state.player.evidenceClassification[id];
  savePlayer();
  paintEvidence();
  checkAllEvidenceClassified();
}

// Fires once, the moment all 8 real folders have a Relevant/Red Herring answer. Re-uses the
// exact reveal + remaining-time logic evidenceView() already runs for the natural 8-minute
// mark, by simply moving the room's start time back so that mark has just been reached.
function checkAllEvidenceClassified(){
  const p = state.player;
  if(!p || p.allEvidenceDone) return;
  const c = CASES[p.caseIndex];
  const cls = p.evidenceClassification || {};
  if(c.evidence.filter(e=>cls[e.id]).length < c.evidence.length) return;
  p.allEvidenceDone = true;
  const hadTwist = p.twistRevealed;
  if(p.evidenceStartedAt && evidenceElapsed() < TWIST_RELEASE_AT_SECONDS){
    p.evidenceStartedAt = Date.now() - TWIST_RELEASE_AT_SECONDS*1000;   // final 2 minutes start now
  }
  savePlayer();
  state.evidenceTimerActive = false;   // force the room to rebuild its countdown from the new start time
  if(state.view === 'evidence'){
    render();
    if(!hadTwist) showToast('🕵️ All evidence classified — Evidence #9 is in. 2 minutes left.');
  }
}

function evidenceElapsed(){
  const st = state.player && state.player.evidenceStartedAt;
  return st ? (Date.now() - st)/1000 : 0;
}
// Watches for the 9th evidence (8 min after entering the room, or the facilitator's
// release). Runs in the Evidence Room AND on the Five Whys page, so the twist
// reaches players wherever they are in that stretch.
async function checkTwist(){
  const p = state.player;
  if(!p || p.twistRevealed) return;
  if(p.evidenceStartedAt && evidenceElapsed() >= TWIST_RELEASE_AT_SECONDS){ revealTwist(); return; }
  const flag = await storageGet('global_event_twist_'+p.caseIndex, true);
  // only honour a release issued while this player's case file existed (a leftover flag from an old session is ignored)
  if(flag && flag.released && (flag.at||0) >= (p.createdAt||0)) revealTwist();
}
function startTwistWatch(){
  stopPoll();
  if(!state.player || state.player.twistRevealed) return;
  state.pollHandle = setInterval(checkTwist, 6000);
}
function revealTwist(){
  if(!state.player || state.player.twistRevealed) return;
  state.player.twistRevealed = true;
  stopPoll();
  savePlayer();
  if(state.view === 'evidence' || state.view === 'whys'){
    captureDrafts();   // don't wipe half-typed answers when the page redraws
    render();
    showToast('🔎 Evidence #9 has just surfaced');
  }
}

  const items = [0,1,2,3,4].map(i=>`
    <div class="why-item">

      </div>

// Pull whatever is typed in the current step's boxes into the player record,
// so Back buttons, logout and reloads never lose a draft.
function captureDrafts(){
  const p = state.player; if(!p) return;
  const g = id => document.getElementById(id);
  for(let i=0;i<5;i++){ const el = g('why'+i); if(el) p.whys[i] = el.value; }
  const rc = g('rootCause'); if(rc) p.rootCause = rc.value;
  const fx = g('fixText');   if(fx) p.fix = fx.value;
  const ro = g('roiText');   if(ro) p.roi = ro.value;
  const pn = g('pitchNotes'); if(pn) p.pitchNotes = pn.value;
}
let _draftTimer = null;
document.addEventListener('input', e=>{
  if(!state.player || !e.target || e.target.tagName !== 'TEXTAREA') return;
  captureDrafts();
  clearTimeout(_draftTimer);
  _draftTimer = setTimeout(()=>{ if(state.player) savePlayer(); }, 800);
});

function advanceTo(view){
  captureDrafts();
  const stepMap = {'briefing':0,'evidence':1,'whys':2,'concept':3,'fix':4,'pitch':5,'summary':6};
  if(stepMap[view] !== undefined){
    state.player.step = stepMap[view];
  }
  savePlayer();
  goto(view);
}

// ---------- PDF EXPORT ----------
async function savePdf(doc, filename){
  try{ doc.save(filename); }
  catch(e){ showToast('Could not save the PDF.'); }
}
async function downloadSummaryPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const p = state.player;
  const c = CASES[p.caseIndex];
  const concept = CONCEPTS.find(x=>x.id===p.concept);
  const margin = 48;
  let y = margin;
  const pageWidth = doc.internal.pageSize.getWidth();
  const maxWidth = pageWidth - margin*2;

  function addTitle(text, size){
    doc.setFont('helvetica','bold'); doc.setFontSize(size||16);
    doc.text(text, margin, y); y += size ? size*0.9 : 20;
  }
  function addLabel(text){
    checkPage(20);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(120,90,40);
    doc.text(text.toUpperCase(), margin, y); y+=14;
    doc.setTextColor(20,20,20);
  }
  function addBody(text){
    doc.setFont('courier','normal'); doc.setFontSize(10.5);
    const lines = doc.splitTextToSize(text && text.trim() ? text : '(not completed)', maxWidth);
    lines.forEach(line=>{
      checkPage(14);
      doc.text(line, margin, y); y+=14;
    });
    y+=8;
  }
  function checkPage(need){
    if(y+need > doc.internal.pageSize.getHeight()-margin){ doc.addPage(); y = margin; }
  }

  addTitle('The Fifth Gate — Case Summary', 18);
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(90,90,90);
  doc.text('Detective: ' + (p.displayName||p.username), margin, y); y+=14;
  doc.text('Case #' + (p.caseIndex+1) + ': ' + c.title + ' (' + c.industry + ')', margin, y); y+=14;
  doc.text('Generated: ' + new Date().toLocaleString(), margin, y); y+=22;
  doc.setTextColor(20,20,20);

  addLabel('Case Briefing');
  addBody(c.briefing + '\n\nMission: ' + c.mission);

  addLabel('Evidence Reviewed (' + p.evidenceReviewed.length + '/8' + (p.twistRevealed?' + twist card':'') + ')');
  const revList = c.evidence.filter(e=>p.evidenceReviewed.includes(e.id)).map(e=>'- ['+e.tag+'] '+e.title+': '+e.text).join('\n');
  addBody(revList + (p.twistRevealed ? '\n- [TWIST] '+c.twist.text : ''));

  addLabel('Five Whys Chain');
  addBody(p.whys.map((w,i)=> w ? ('Why '+(i+1)+': '+w) : null).filter(Boolean).join('\n'));

  addLabel('Root Cause Statement');
  addBody(p.rootCause);

  addLabel('Lean Concept Drawn');
  addBody(concept ? concept.name + ' — ' + concept.blurb : '');

  addLabel('Prescribed Fix');
  addBody(p.fix);

  addLabel('Predicted Outcome / ROI');
  addBody(p.roi);

  addLabel('Pitch Notes');
  addBody(p.pitchNotes);

  await savePdf(doc, '5-whys-case-summary-'+slug(p.displayName||p.username)+'.pdf');
}

async function downloadCohortPDF(){
  showToast('Building cohort report…');
  const keys = await storageListKeys('player:', true);
  const players = [];
  for(const k of keys){
    const v = await storageGet(k, true);
    if(v) players.push(v);
  }
  players.sort((a,b)=> (b.totalScore||0) - (a.totalScore||0) || a.username.localeCompare(b.username));

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const margin = 44;
  let y = margin;
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const maxWidth = pageWidth - margin*2;

  function checkPage(need){
    if(y+need > pageHeight-margin){ doc.addPage(); y = margin; return true; }
    return false;
  }
  function heading(text,size){
    checkPage((size||16)+6);
    doc.setFont('helvetica','bold'); doc.setFontSize(size||16); doc.setTextColor(20,20,20);
    doc.text(text, margin, y); y += (size||16)+6;
  }
  function subtext(text){
    checkPage(14);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(100,100,100);
    doc.text(text, margin, y); y += 14;
  }
  function label(text){
    checkPage(14);
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(140,105,45);
    doc.text(text.toUpperCase(), margin, y); y += 12;
    doc.setTextColor(20,20,20);
  }
  function body(text){
    doc.setFont('courier','normal'); doc.setFontSize(9.5); doc.setTextColor(20,20,20);
    const lines = doc.splitTextToSize(text && text.trim() ? text : '(not completed)', maxWidth);
    lines.forEach(line=>{ checkPage(12); doc.text(line, margin, y); y+=12; });
    y += 6;
  }

  // Cover / leaderboard
  heading('The Fifth Gate — Cohort Results Report', 18);
  subtext('Generated: ' + new Date().toLocaleString());
  subtext(players.length + ' detective(s) registered across ' + CASES.length + ' possible cases.');
  y += 8;

  heading('Leaderboard', 13);
  const colX = {rank:margin, name:margin+34, caseNo:margin+210, concept:margin+300, score:pageWidth-margin-50};
  checkPage(16);
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(100,100,100);
  doc.text('#', colX.rank, y);
  doc.text('Detective', colX.name, y);
  doc.text('Case', colX.caseNo, y);
  doc.text('Concept', colX.concept, y);
  doc.text('Score', colX.score, y);
  y += 6;
  checkPage(4);
  doc.setDrawColor(200,200,200);
  doc.line(margin, y, pageWidth-margin, y);
  y += 12;

  players.forEach((p,i)=>{
    checkPage(16);
    const concept = CONCEPTS.find(x=>x.id===p.concept);
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(20,20,20);
    doc.text(String(i+1), colX.rank, y);
    doc.text(String(p.displayName||p.username).slice(0,26), colX.name, y);
    doc.text('#'+(p.caseIndex+1), colX.caseNo, y);
    doc.text(concept ? concept.name.slice(0,22) : '—', colX.concept, y);
    doc.text(p.totalScore!=null ? p.totalScore.toFixed(0) : '—', colX.score, y);
    y += 15;
  });

  // Per-player detail pages
  players.forEach(p=>{
    doc.addPage(); y = margin;
    const c = CASES[p.caseIndex];
    const concept = CONCEPTS.find(x=>x.id===p.concept);
    heading((p.displayName||p.username), 16);
    subtext('Login: ' + p.username + '   ·   Case #' + (p.caseIndex+1) + ': ' + c.title + ' (' + c.industry + ')');
    subtext('Status: ' + (p.completed ? 'Complete' : STEP_LABELS[Math.min(p.step, STEP_LABELS.length-1)]) + '   ·   First login: ' + (p.createdAt ? new Date(p.createdAt).toLocaleString() : '—') + '   ·   Last active: ' + (p.updatedAt ? new Date(p.updatedAt).toLocaleString() : '—'));
    y += 6;

    label('Root cause statement (theirs)');
    body(p.rootCause);
    label('Suggested root cause (facilitator reference)');
    body(c.facilitatorNotes.suggestedRootCause);
    if(c.source){ label('Real case source'); body(c.source); }
    label('Lean concept drawn');
    body(concept ? concept.name + ' — ' + concept.blurb : '');
    label('Prescribed fix');
    body(p.fix);
    label('Predicted outcome / ROI');
    body(p.roi);

    if(p.scores){
      label('Scores');
      body(
        'Root cause accuracy (30%): ' + p.scores.rootCause + '\n' +
        'Red herrings avoided (10%): ' + p.scores.herring + '\n' +
        'Fit-to-concept reasoning (30%): ' + p.scores.fit + '\n' +
        'Clarity of ROI (20%): ' + p.scores.roi + '\n' +
        'Time discipline (10%): ' + p.scores.time + '\n' +
        'WEIGHTED TOTAL: ' + p.totalScore.toFixed(1) + ' / 100'
      );
    } else {
      label('Scores');
      body('Not yet graded.');
    }
  });

  await savePdf(doc, '5-whys-detective-cohort-report.pdf');
}

// ---------- FACILITATOR DASHBOARD ----------
async function facilitatorDashboardView(){
  setTimeout(()=>{
    let t = null;
    startLiveFeed(()=>{ clearTimeout(t); t = setTimeout(()=>{ if(state.view==='facilitator-dashboard' && document.getElementById('facRoot')) refreshFacilitator(); }, 250); });
  }, 0);
  return `<div id="facRoot">${await renderFacilitatorTable()}</div>`;
}

async function renderFacilitatorTable(){
  const keys = await storageListKeys('player:', true);
  const players = [];
  for(const k of keys){
    const v = await storageGet(k, true);
    if(v) players.push(v);
  }
  players.sort((a,b)=> (b.totalScore||0) - (a.totalScore||0) || a.username.localeCompare(b.username));

  const rows = players.map(p=>{
    const stepLabel = p.completed ? 'Complete' : STEP_LABELS[Math.min(p.step, STEP_LABELS.length-1)];
    const concept = CONCEPTS.find(x=>x.id===p.concept);
    const isActive = p.updatedAt && (Date.now()-p.updatedAt) < 3*60*1000;
    return `<tr>
      <td>
        <strong>${escapeHtml(p.displayName||p.username)}</strong>
        <div class="muted small mono" style="margin-top:2px;">${escapeHtml(p.email||p.username)}</div>
      </td>
      <td>#${p.caseIndex+1} — ${escapeHtml(CASES[p.caseIndex].title)}</td>
      <td><span class="badge-step">${escapeHtml(stepLabel)}</span></td>
      <td>${concept ? escapeHtml(concept.name) : '<span class="muted">—</span>'}</td>
      <td class="small">
        <div>${fmtClock(p.createdAt)}</div>
        <div class="muted" style="display:flex;align-items:center;gap:5px;">
          <span style="width:7px;height:7px;border-radius:50%;display:inline-block;background:${isActive?'#5e8f6b':'#666'};"></span>
          ${relTime(p.updatedAt)}
        </div>
      </td>
      <td>${p.totalScore!=null ? '<span class="score-pill">'+p.totalScore.toFixed(0)+'</span>' : '<span class="muted">not graded</span>'}</td>
      <td class="mono" style="text-align:center;" title="Times this detective's tab lost focus during the case">${p.tabSwitchCount||0}</td>
      <td class="mono" style="text-align:center;" title="Total time this detective has spent with the case file panel open">${fmtTime(p.caseFileSeconds||0)}</td>
      <td><button class="btn secondary" style="padding:6px 12px;font-size:13px;" onclick="openFacilitatorDetail('${p.username}')">View / Score</button></td>
    </tr>`;
  }).join('') || `<tr><td colspan="9" class="muted">No detectives have logged in yet.</td></tr>`;

  return `
  <div class="card">
    <div class="flex-between">
      <div>
        <h2 style="margin:0;">Facilitator Dashboard</h2>
        <p class="muted small" style="margin:4px 0 0;">${players.length} detective${players.length===1?'':'s'} registered across ${CASES.length} possible cases.</p>
      </div>
      <div class="row">
        <span class="pillbtn mono" style="border-color:var(--good);color:var(--good);">● LIVE</span><button class="pillbtn" onclick="copyParticipantLink()">🔗 Copy participant link</button><button class="pillbtn" onclick="refreshFacilitator()">↻ Refresh</button>
        <button class="btn" onclick="downloadCohortPDF()">⬇ Download cohort report (PDF)</button>
      </div>
    </div>
    <hr class="dash">
    <h3 style="margin:0 0 8px;font-size:15px;">Release the twist card for a specific case (all tables working that case, simultaneously)</h3>
    <div class="row" style="flex-wrap:wrap;">
      ${CASES.map((c,i)=>`<button class="pillbtn" onclick="releaseTwistForCase(${i})">Case #${i+1}</button>`).join('')}
    </div>
    <hr class="dash">
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Detective</th><th>Case</th><th>Progress</th><th>Concept drawn</th><th>Logged in / Last active</th><th>Score</th><th>Tab switches</th><th>Case file time</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

async function refreshFacilitator(){
  const el = document.getElementById('facRoot');
  if(el) el.innerHTML = await renderFacilitatorTable();
}

async function releaseTwistForCase(idx){
  const ok = await storageSet('global_event_twist_'+idx, {released:true, at:Date.now()}, true);
  showToast(ok ? 'Twist card released for Case #'+(idx+1)+' — all matching tables will see it within a few seconds.' : '⚠ Could not release twist card — try again.');
}

async function openFacilitatorDetail(username){
  state.facilitatorDetailUser = username;
  goto('facilitator-detail');
}

async function facilitatorDetailView(){
  const p = await storageGet('player:'+state.facilitatorDetailUser, true);
  if(!p) return `<div class="card">Detective not found. <button class="btn secondary" onclick="goto('facilitator-dashboard')">Back</button></div>`;
  const c = CASES[p.caseIndex];
  const concept = CONCEPTS.find(x=>x.id===p.concept);
  const classification = p.evidenceClassification || {};
  const reviewed = c.evidence.map(e=>{
    const seen = p.evidenceReviewed.includes(e.id);
    const isHerring = c.facilitatorNotes.herringIds.includes(e.id);
    const guess = classification[e.id]; // 'relevant' | 'herring' | undefined
    const guessedHerring = guess === 'herring';
    const correct = guess ? (guessedHerring === isHerring) : null;
    let guessTagHtml = '<span class="herring-tag no" style="opacity:.6;">not classified</span>';
    if(guess){
      const guessLabel = guessedHerring ? 'guessed: RED HERRING' : 'guessed: RELEVANT CLUE';
      const resultCls = correct ? 'no' : 'yes'; // reuse styles: 'no'=green(good), 'yes'=red(bad) per existing herring-tag palette
      guessTagHtml = `<span class="herring-tag ${resultCls}">${guessLabel} ${correct?'✓':'✗'}</span>`;
    }
    return `<div class="summary-block" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
        <strong style="font-size:13.5px;">${seen?'✓':'—'} [${escapeHtml(e.tag)}] ${escapeHtml(e.title)}</strong>
        <span>
          <span class="herring-tag ${isHerring?'yes':'no'}">${isHerring?'RED HERRING':'RELEVANT CLUE'}</span>
          ${guessTagHtml}
        </span>
      </div>
      <div class="small muted" style="margin-top:4px;">${escapeHtml(e.text)}</div>
    </div>`;
  }).join('');

  const scores = p.scores || {rootCause:70, herring:70, fit:70, roi:70, time:70};
  const block = (title, content) => `<div class="summary-block"><h3>${title}</h3><div class="content ${content?'':'empty'}">${escapeHtml(content) || 'Not completed'}</div></div>`;

  return `
  <div class="card">
    <button class="pillbtn" onclick="goto('facilitator-dashboard')">← All detectives</button>
    <div class="flex-between" style="margin-top:14px;">
      <div>
        <span class="stamp-tag">CASE #${p.caseIndex+1}</span>
        <h2 style="margin:10px 0 0;">${escapeHtml(p.displayName||p.username)}</h2>
        <p class="muted small mono">${escapeHtml(p.email||p.username)}</p>
        <p class="muted small">${escapeHtml(c.title)} · ${escapeHtml(c.industry)} · Progress: ${p.completed?'Complete':STEP_LABELS[Math.min(p.step,STEP_LABELS.length-1)]}</p>
        <p class="muted small">First logged in: ${fmtClock(p.createdAt)} on ${p.createdAt?new Date(p.createdAt).toLocaleDateString():'—'} · Last active: ${relTime(p.updatedAt)}</p>
        <p class="muted small">🔀 Tab switches during case: <strong style="color:var(--text);">${p.tabSwitchCount||0}</strong></p>
        <p class="muted small">📖 Case file re-opened for: <strong style="color:var(--text);">${fmtTime(p.caseFileSeconds||0)}</strong></p>
      </div>
    </div>
    <hr class="dash">
    <h3 style="font-size:14px;color:var(--gold);font-family:'Courier Prime',monospace;">EVIDENCE — WITH ANSWER KEY</h3>
    ${reviewed}
    ${p.twistRevealed ? `<div class="summary-block"><strong class="small">✓ [TWIST] ${escapeHtml(c.twist.tag)}</strong><div class="small muted" style="margin-top:4px;">${escapeHtml(c.twist.text)}</div></div>` : `<p class="small muted">Twist card not yet revealed for this detective.</p>`}
    <hr class="dash">
    ${block('FIVE WHYS CHAIN', p.whys.map((w,i)=>w?('Why '+(i+1)+': '+w):'').filter(Boolean).join('\n'))}
    ${block('ROOT CAUSE STATEMENT (theirs)', p.rootCause)}
    <div class="summary-block">
      <h3>SUGGESTED ROOT CAUSE (facilitator reference)</h3>
      <div class="content">${escapeHtml(c.facilitatorNotes.suggestedRootCause)}</div>
      ${c.source ? `<div class="content" style="margin-top:8px;opacity:.75;font-size:12.5px;">Real case source: ${escapeHtml(c.source)}</div>` : ''}
    </div>
    ${block('LEAN CONCEPT DRAWN', concept ? concept.name + ' — ' + concept.blurb : '')}
    ${block('PRESCRIBED FIX', p.fix)}
    ${block('PREDICTED OUTCOME / ROI', p.roi)}
    ${block('PITCH NOTES', p.pitchNotes)}
    <hr class="dash">
    <h3 style="font-size:14px;color:var(--gold);font-family:'Courier Prime',monospace;">SCORE THIS CASE</h3>
    <div class="rubric-grid">
      ${rubricRow('rootCause','Root cause accuracy (30%)', scores.rootCause)}
      ${rubricRow('herring','Red herrings avoided (10%)', scores.herring)}
      ${rubricRow('fit','Fit-to-concept reasoning (30%)', scores.fit)}
      ${rubricRow('roi','Clarity of ROI (20%)', scores.roi)}
      ${rubricRow('time','Time discipline (10%)', scores.time)}
    </div>
    <div class="row" style="margin-top:16px;">
      <button class="btn" onclick="saveFacilitatorScore('${p.username}')">Save score</button>
      <span id="totalPreview" class="muted small"></span>
    </div>
  </div>`;
}

function rubricRow(key,label,val){
  return `<div class="rubric-item">
    <label><span>${label}</span><span id="${key}Val" class="mono">${val}</span></label>
    <input type="range" min="0" max="100" step="5" value="${val}" id="${key}Range" oninput="document.getElementById('${key}Val').textContent=this.value; updateTotalPreview();">
  </div>`;
}

function updateTotalPreview(){
  const g = id => Number(document.getElementById(id).value);
  const total = g('rootCauseRange')*0.3 + g('herringRange')*0.1 + g('fitRange')*0.3 + g('roiRange')*0.2 + g('timeRange')*0.1;
  const el = document.getElementById('totalPreview');
  if(el) el.textContent = 'Weighted total: ' + total.toFixed(1) + ' / 100';
}

async function saveFacilitatorScore(username){
  const g = id => Number(document.getElementById(id).value);
  const scores = {rootCause:g('rootCauseRange'), herring:g('herringRange'), fit:g('fitRange'), roi:g('roiRange'), time:g('timeRange')};
  const total = scores.rootCause*0.3 + scores.herring*0.1 + scores.fit*0.3 + scores.roi*0.2 + scores.time*0.1;
  const ok = await storageUpdate('player:'+username, {scores, totalScore: total});
  showToast(ok ? 'Score saved: '+total.toFixed(1)+' / 100' : '⚠ Score did not save — try again.');
}

function showToast(msg){
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  const t = document.createElement('div');
  t.className='toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

function attachHandlers(){
  const nameInput = document.getElementById('loginName');
  if(nameInput){ nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doParticipantLogin(); }); }
  const pwInput = document.getElementById('facPw');
  if(pwInput){ pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doFacilitatorLogin(); }); }
  if(state.view === 'facilitator-detail') updateTotalPreview();
}

// ---------- TAB SWITCH TRACKING ----------
// Counts every time the participant navigates away from this tab/window (switches tabs,
// switches apps, minimizes) while a case is in progress, and surfaces it to both dashboards.
const TAB_SWITCH_PENALTY_SECONDS = 15;
// Takes 15 seconds off whichever countdown is running (Briefing, Evidence Room or Pitch Prep).
// Returns true if a countdown was actually reduced.
function applyTabSwitchPenalty(){
  if(!state.timerHandle || !state.timerEndAt) return false;
  state.timerEndAt -= TAB_SWITCH_PENALTY_SECONDS*1000;
  // The Evidence Room clock is measured from when the player entered the room, so move that back
  // too — keeps the 8-minute twist mark and any later re-entry in step with the reduced clock.
  if(state.timerLabel === 'Evidence Investigation' && state.player && state.player.evidenceStartedAt){
    state.player.evidenceStartedAt -= TAB_SWITCH_PENALTY_SECONDS*1000;
  }
  state.timerSeconds = Math.max(0, Math.round((state.timerEndAt - Date.now())/1000));
  return true;
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    if(state.role === 'participant' && state.player){
      state.player.tabSwitchCount = (state.player.tabSwitchCount || 0) + 1;
      if(applyTabSwitchPenalty()) state.tabPenaltyPending = true;
      savePlayer();
    }
  } else {
    if(state.role === 'participant' && state.player){
      if(state.timerHandle && state.timerEndAt){
        state.timerSeconds = Math.max(0, Math.round((state.timerEndAt - Date.now())/1000));   // catch up after background throttling
      }
      render();   // refresh the on-screen counter once they return
      if(state.tabPenaltyPending){
        state.tabPenaltyPending = false;
        showToast('⚠ Tab switch — '+TAB_SWITCH_PENALTY_SECONDS+' seconds taken off the clock');
      }
    }
  }
});

// ---------- BOOT ----------
render();
</script>
